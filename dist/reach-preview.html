<script>
(function () {
  function boot() {
    try {
      var bin = atob(document.getElementById('reach-bundle').textContent.trim());

      var code = new TextDecoder('utf-8').decode(bytes);
      var url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      import(url).catch(show);
    } catch (err) { show(err); }

  function show(err) {

})();
